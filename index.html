    <script>
      // Global error suppression for external network noise and non-critical cancellation events
      (function() {
        var isSuppressed = function(str) {
          var s = String(str || '').toLowerCase();
          return (
            s.indexOf('ads request timed out') !== -1 ||
            s.indexOf('failed timeout') !== -1 ||
            s.indexOf('popup-closed-by-user') !== -1 ||
            s.indexOf('cancelled-popup-request') !== -1 ||
            s.indexOf('unauthorized-domain') !== -1 ||
            s === 'script error.'
          );
        };

        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var combined = args.map(function(a) { return String(a && (a.message || a.code || a) || ''); }).join(' ');
          if (isSuppressed(combined)) {
            console.debug('[Handled external event]:', combined);
            return;
          }
          return origError.apply(console, arguments);
        };

        window.onerror = function(message, source, lineno, colno, error) {
          var strMsg = String(message || '');
          if (isSuppressed(strMsg)) {
            console.debug('Suppressed non-fatal external event:', strMsg);
            return true;
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var reasonStr = String(reason && (reason.message || reason.code || reason) || '');
          if (isSuppressed(reasonStr)) {
            console.debug('Handled benign promise rejection:', reasonStr);
            event.preventDefault();
          }
        });
      })();
    </script>

        .animate-shimmer {
            position: relative;
            overflow: hidden;
        }
        .animate-shimmer::after {
            position: absolute;

            background-image: linear-gradient(
